name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build and static export
        run: |
          npx vinext build
          if [ -d "build" ]; then
            echo "Usando carpeta build existente"
          else
            mkdir -p build
            cp -r dist/client/* build/ || true
          fi
          touch build/.nojekyll
          
          # Si no existe index.html en la raiz, creamos un fallback para la app
          if [ ! -f "build/index.html" ]; then
            find build -name "*.html" -exec cp {} build/index.html \; -quit || true
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
